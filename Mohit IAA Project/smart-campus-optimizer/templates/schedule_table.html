<div class="table-wrap"><table><thead><tr><th>DAY</th><th>TIME</th><th>SUBJECT</th><th>FACULTY</th><th>ROOM</th></tr></thead><tbody>{% for e in entries|sort(attribute='day') %}<tr><td><b>{{ e.day }}</b></td><td>{{ e.slot }}</td><td><b>{{ e.subject.name }}</b><small class="table-sub">{{ e.subject.code }}</small></td><td>{{ e.subject.teacher.name if e.subject.teacher else 'Unassigned' }}</td><td><span class="room-tag">{{ e.room.name }}</span></td></tr>{% else %}<tr><td colspan="5" class="empty">No timetable entries available yet.</td></tr>{% endfor %}</tbody></table></div>
